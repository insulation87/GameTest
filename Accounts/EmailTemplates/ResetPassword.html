<!doctype html>
<html lang="zh-Hant"><body style="font-family:Arial,sans-serif;background:#101827;color:#e5edf7;padding:32px">
  <h1>重設遊戲帳號密碼</h1>
  <p>請回到遊戲的「忘記密碼」畫面，輸入以下驗證碼與新密碼：</p>
  <p style="font-size:32px;letter-spacing:8px;font-weight:bold;color:#7dd3fc">{{ .Token }}</p>
  <p>若不是你要求重設密碼，請忽略此郵件。請勿將驗證碼提供給其他人。</p>
</body></html>
