services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Set Supabase project URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set public publishable key}
    expose: ["8080"]
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set relay domain}
    ports: ["443:443", "80:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [relay]
volumes:
  caddy_data:
  caddy_config:
